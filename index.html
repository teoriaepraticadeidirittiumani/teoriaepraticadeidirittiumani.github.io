<title>Diritti in scena: calendario delle presentazioni</title>
<style>
:root{--bg:#fff;--ink:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--soft:#f0f0f4;--acc:#1d2b64;--accbg:#e4e8f6;--card:#f2f2f7;--btn:#1d2b64;--btnink:#fff;--err:#c0392b;--lb:#2f7be0;--lbbg:#e3f0ff;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f2f2f7;--mute:#8e8e93;--line:#3a3a3c;--soft:#1c1c1e;--acc:#8fa6ff;--accbg:#1a2244;--card:#1c1c1e;--btn:#8fa6ff;--btnink:#0b1020;--err:#ff6a5f;--lb:#8ab4ff;--lbbg:#15243b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.4}
input,button,textarea{font-family:Georgia,"Times New Roman",serif;font-size:1rem;color:inherit}
main{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(92px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.3rem;font-weight:bold;line-height:1.3;margin:6px 4px 6px}
.sub{color:var(--mute);font-size:.88rem;margin:2px 4px 12px}
.hd{text-align:center;margin-bottom:6px}
.hd h1{margin:6px 4px 4px}
.h2{font-size:.92rem;font-weight:bold;line-height:1.3;margin:0 4px 8px}
.hd h1.brand{font-family:'Playfair Display','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:2.5rem;font-style:italic;font-weight:700;line-height:1.1;letter-spacing:.01em;color:var(--acc);margin:8px 4px 6px}
.hd h1.brand::after{content:"";display:block;width:54px;height:2px;background:var(--acc);margin:7px auto 0;border-radius:2px;opacity:.55}
.tag{font-size:15px;font-weight:bold;line-height:1.35;margin:6px 4px 6px;white-space:nowrap}
.page[hidden]{display:none}
.cal{display:grid;grid-template-columns:40px repeat(2,1fr);border-top:1px solid var(--line)}
.seclb{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:18px 4px 6px}
.head{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.head .w{font-size:.72rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.head .n{font-size:1.5rem;line-height:1.1}
.head .m{font-size:.72rem;color:var(--mute)}
.axis div{height:26px;position:relative}
.axis span{position:absolute;top:-8px;right:5px;font-size:.7rem;color:var(--mute)}
.col{border-left:1px solid var(--line);position:relative}
.cal.ro .cell{cursor:default;-webkit-tap-highlight-color:transparent}
.cal .ev.tap{pointer-events:auto;cursor:pointer}
.cell{display:block;width:100%;height:26px;border:0;border-top:1px solid var(--soft);background:none;padding:0;cursor:pointer}
.cell.h{border-top-color:var(--line)}
.ev{position:absolute;background:var(--accbg);border-left:3px solid var(--acc);border-radius:5px;padding:1px 4px;overflow:hidden;pointer-events:none;font-size:.72rem;line-height:1.2;z-index:1;word-break:break-word}
.ev.one{white-space:nowrap;text-overflow:ellipsis}
.msg{padding:10px 6px;color:var(--mute);font-size:.9rem}
.err{color:var(--err)}
.note{color:var(--mute);font-size:.85rem;padding:6px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet[hidden]{display:none}
#psheet.center{align-items:center;padding:16px}#psheet.center .panel{border-radius:16px;max-width:400px;max-height:calc(100% - 32px);padding:16px}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.panel h2{font-size:1.15rem;font-weight:normal;margin:0}
.panel .when{color:var(--mute);font-size:.88rem;margin-bottom:10px}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.who small{color:var(--mute)}
input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px}
textarea{min-height:110px;font-size:.9rem}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;line-height:1.25}
.seg button.on{border-color:var(--acc);background:var(--accbg)}
.seg button:disabled{opacity:.4;cursor:default}
.seg small{display:block;color:var(--mute)}
button.p{width:100%;margin-top:12px;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:11px;cursor:pointer}
button.p.s{background:var(--card);color:var(--ink)}
button.p:disabled{opacity:.6}
button.g{border:0;background:none;color:var(--acc);cursor:pointer;padding:4px 6px}
button.x{float:right;border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer}
.hint{color:var(--mute);font-size:.78rem;margin:4px 2px 0}
/* elenco */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top button{margin-top:8px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}

  function book(){
    if(busy)return;
    if(!open)return;
    var np=dur===30?3:dur===20?2:1,names=[],matrs=[];
    for(var k=0;k<np;k++){
      var nk=$('nm'+k).value.trim();
      if(!nk){$('nm'+k).focus();say(np>1?'Scrivi nome e cognome di tutte e '+np+' le persone.':'Scrivi nome e cognome.');return}
      names.push(nk);matrs.push($('mt'+k).value.trim());
    }
    var topic=$('tp').value.trim();
    if(!topic){$('tp').focus();return}
    var name=names.join(', '),matr=matrs.some(function(x){return x})?matrs.map(function(x){return x||'—'}).join(', '):'';
    if(overlapsBlock(open.d,open.m,open.m+dur)){say('In questa fascia non si accettano prenotazioni.');return}
    saved=names[0];savedM=matrs[0];try{localStorage.setItem('nome',saved);localStorage.setItem('matr',savedM)}catch(e){}
    busy=true;$('go').disabled=true;$('go').textContent='Salvo…';
    fetch(DB+'/bookings.json',{method:'POST',body:JSON.stringify({day:open.d,start:open.m,dur:dur,name:name,topic:topic,token:token,ts:Date.now()})})
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(function(j){
        if(!matr||!j||!j.name)return;
        return fetch(DB+'/matricole/'+encodeURIComponent(j.name)+'.json',{method:'PUT',body:JSON.stringify({matricola:matr})}).catch(function(){});
      })
      .then(function(){return load()})
      .then(function(){busy=false;open=null;sheet()})
      .catch(function(){busy=false;if($('go')){$('go').disabled=false;$('go').textContent='Prenotami'}say('Non sono riuscito a salvare. Riprova tra poco.')});
  }

    list.reduce(function(pr,a){return pr.then(function(){
      return fetch(DB+'/bookings.json',{method:'POST',body:JSON.stringify({day:a.day,start:a.start,dur:a.dur,name:a.name,topic:a.topic||'',token:'import',ts:Date.now()+n})})
        .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
        .then(function(j){
          return (a.matricola?gdb('/matricole/'+encodeURIComponent(j.name),'PUT',{matricola:a.matricola}):Promise.resolve())
            .then(function(){
              return provaAll.filter(function(e){return e.pub===a.id}).reduce(function(p2,e){return p2.then(function(){return gdb('/gestione/prova/'+encodeURIComponent(e.id),'PUT',{pr:e.pr,prn:e.prn||undefined,chk:e.chk||undefined,nm:e.nm||undefined,imp:e.imp||undefined,pid:e.pid,day:e.day,start:e.start,dur:e.dur,ts:Date.now(),pub:j.name,vis:true})})},Promise.resolve());

            .then(function(){n++});

      if(st<FROM||st+pst.dur>TO){say('L’orario deve stare tra le 8:00 e le 19:00.');return}
      var e=prova.filter(function(x){return x.id===pst.id})[0];
      gdb('/gestione/prova/'+encodeURIComponent(pst.id),'PUT',{pr:e.pr,prn:e.prn||undefined,chk:e.chk||undefined,nm:e.nm||undefined,imp:e.imp||undefined,pid:e.pid,day:pst.day,start:st,dur:pst.dur,ts:Date.now(),pub:e.pub||undefined,vis:e.vis||undefined}).then(function(){pst=null;asig='';return loadAdmin()}).then(function(){psheet()}).catch(function(){say('Non sono riuscito a salvare.')});
    };
    if($('edel'))$('edel').onclick=function(){gdb('/gestione/prova/'+encodeURIComponent(pst.id),'DELETE').then(function(){pst=null;asig='';return loadAdmin()}).then(function(){psheet()}).catch(function(){say('Non sono riuscito a rimuovere.')})};
  }
  $('psheet').addEventListener('click',function(e){if(e.target===$('psheet')){pst=null;psheet()}});

  /* carica la bozza nel calendario normale */
  function publishProva(){
    var todo=prova.filter(function(e){return !e.pub&&pOf(e)});
    if(!todo.length||busy)return;
    return ask('Caricare '+todo.length+' persone nel calendario normale? Saranno in azzurro e le vedrà solo chi ha la password.','Carica').then(function(ok){
    if(!ok)return;
    busy=true;var n=0;$('ppub').disabled=true;$('ppub').textContent='Carico…';
    todo.reduce(function(pr,e){return pr.then(function(){
      var p=pOf(e);
      return gdb('/gestione/assegnati','POST',{pid:e.pid,day:e.day,start:e.start,dur:e.dur,name:p.nome,topic:p.argomento||'',matricola:p.matricola||'',ts:Date.now()+n})
        .then(function(j){return gdb('/gestione/prova/'+encodeURIComponent(e.id),'PUT',{pr:e.pr,prn:e.prn||undefined,chk:e.chk||undefined,nm:e.nm||undefined,imp:e.imp||undefined,pid:e.pid,day:e.day,start:e.start,dur:e.dur,ts:Date.now(),pub:j.name})})
        .then(function(){n++});
    })},Promise.resolve()).then(function(){say('Caricate '+n+' persone nel calendario normale, visibili solo con la password.')},function(){say('Caricate '+n+' persone, poi si è interrotto. Controlla il calendario prima di riprovare.')})
      .then(function(){busy=false;asig='';return loadAdmin()});
    });
  }

  function renderEl(){
    var a=$('pageEl');
    if(!admin){a.innerHTML='';return}
    var keep={};['pn','pm','pa'].forEach(function(i){var e=$(i);if(e)keep[i]=e.value});
    var h='<div class="top"><h1>Elenco</h1><button class="g" id="exit">Esci</button></div>'+
      '<div class="note" style="margin-top:0">Riservato al coordinamento organizzativo. Non compare nel calendario.</div>'+studLine();
    var list=bookings.map(function(b){return {id:b.id,day:b.day,start:b.start,dur:b.dur,name:b.name,topic:b.topic,matr:matricole[b.id]||'',asg:false}}).concat(assegnati.map(function(a){return {id:a.id,day:a.day,start:a.start,dur:a.dur,name:a.name,topic:a.topic,matr:a.matricola,asg:true}})).sort(function(x,y){return x.day*10000+x.start-(y.day*10000+y.start)});
    h+='<button class="tbtn" id="ptog" aria-expanded="'+provaOpen+'"><span>'+ICO_CAL+'Proposta di calendario <small>('+prList().length+(prList().length===1?' proposta':' proposte')+')</small></span><span>'+(provaOpen?'▴':'▾')+'</span></button>';
    if(provaOpen)h+=provaHtml();
    h+='<button class="tbtn" id="btog" aria-expanded="'+bookOpen+'"><span>'+ICO_LIST+'Prenotazioni del calendario <small>('+list.length+')</small></span><span>'+(bookOpen?'▴':'▾')+'</span></button>';
    if(bookOpen){
      if(!list.length)h+='<div class="note">Nessuna prenotazione.</div>';
      list.forEach(function(p){
        h+='<div class="who"><div><b'+(p.asg?' style="color:var(--lb)"':'')+'>'+esc(p.name)+'</b>'+(p.matr?' · <small>matr. '+esc(p.matr)+'</small>':'')+(p.asg?' · <small>assegnato</small>':'')+'<br><small>'+esc(DAYS[p.day].full)+' · '+hm(p.start)+'–'+hm(p.start+p.dur)+' · '+esc(p.topic)+'</small></div><button class="g" '+(p.asg?'data-adela':'data-adel')+'="'+esc(p.id)+'">Rimuovi</button></div>';
      });
      if(list.length)h+='<button class="lnk" id="bcsv">Scarica prenotazioni (CSV)</button>';
    }
    var nm='';
    if(!persone.length)nm+='<div class="msg">Nessuno in elenco.</div>';
    else{
      nm+='<table class="big"><tr><th></th><th>Nome</th><th>Matricola</th><th>Argomento</th><th>Giornata</th><th></th></tr>';
      persone.forEach(function(p,i){
        nm+='<tr><td class="n">'+(i+1)+'</td><td><b>'+esc(p.nome)+'</b>'+(p.tipo==='g2'?'<br><small class="gm">gruppo da 2</small>':p.tipo==='g3'?'<br><small class="gm">gruppo da 3</small>':'')+(!p.orph&&p.all&&p.all.length>1?'<br><small class="gm">registrazione aggiornata</small>':'')+'</td><td>'+esc(p.matricola||'—')+'</td><td>'+esc(p.argomento||'—')+(p.note?'<br><small class="gm">'+esc(p.note)+'</small>':'')+'</td><td>'+esc(giorniTxt(p.giorni))+'</td><td><button class="g" data-pdel="'+esc(p.id)+'" aria-label="Rimuovi">×</button></td></tr>';
      });
      nm+='</table><button class="lnk" id="pcsv">Scarica elenco (CSV)</button>';
    }
    nm+='<div class="addbox"><div class="addh">'+ICO_PEN+'Aggiungi all’elenco</div>'+
       '<input type="text" id="pn" placeholder="Nome e cognome" maxlength="60" value="'+esc(keep.pn||'')+'">'+
       '<div class="row2"><input type="text" id="pm" placeholder="Matricola" maxlength="20" inputmode="numeric" value="'+esc(keep.pm||'')+'"><input type="text" id="pa" placeholder="Argomento" maxlength="80" value="'+esc(keep.pa||'')+'"></div>'+
       '<div class="tg">'+DAYS.map(function(D,i){return '<button data-g="'+i+'" class="'+(giorniSel.indexOf(i)>=0?'on':'')+'">'+D.w+' '+D.n+'</button>'}).join('')+'</div>'+
       '<button class="p" id="padd">Aggiungi</button></div>';
    h+='<div style="margin-top:22px">'+nm+'</div>';
    h+='<div class="addbox"><div class="addh">Ordine delle schede</div><div class="note">Scegli quale scheda vedono per prima le persone che aprono il sito. Quando non ti serve più raccogliere le disponibilità, metti il calendario per primo: la scheda Disponibilità resta come seconda.</div>'+
       '<div class="seg" style="grid-template-columns:1fr 1fr"><button data-ord="disp" class="'+(!calFirst?'on':'')+'">Disponibilità per prima</button><button data-ord="cal" class="'+(calFirst?'on':'')+'">Calendario per primo</button></div></div>';
    a.innerHTML=h;
    $('exit').onclick=function(){logout(false)};
    $('btog').onclick=function(){bookOpen=!bookOpen;renderEl()};
    $('ptog').onclick=function(){provaOpen=!provaOpen;renderEl()};
    a.querySelectorAll('[data-ord]').forEach(function(b){b.onclick=function(){
      var v=b.getAttribute('data-ord')==='cal';if(v===calFirst)return;
      gdb('/impostazioni','PUT',{calFirst:v}).then(function(){sig='';return load()}).then(function(){say(v?'Ora chi apre il sito vede prima il calendario.':'Ora chi apre il sito vede prima la scheda Disponibilità.')}).catch(function(){say('Non sono riuscito a salvare. Controlla che le regole di Firebase siano aggiornate.')});
    }});
    a.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-g'),k=giorniSel.indexOf(i);if(k>=0)giorniSel.splice(k,1);else giorniSel.push(i);b.className=giorniSel.indexOf(i)>=0?'on':''}});
    a.querySelectorAll('[data-adela]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-adela');ask('Rimuovere questa persona dal calendario?','Rimuovi').then(function(ok){if(ok)delAsg(id)})}});
    a.querySelectorAll('[data-adel]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-adel');ask('Rimuovere questa prenotazione?','Rimuovi').then(function(ok){if(ok)del(id)})}});
    a.querySelectorAll('[data-pdel]').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-pdel');
      ask('Rimuovere questa persona dall’elenco?','Rimuovi').then(function(ok){
        if(!ok)return;
        var mine=provaAll.filter(function(e){return e.pid===id});
        mine.reduce(function(pr,e){return pr.then(function(){return gdb('/gestione/prova/'+encodeURIComponent(e.id),'DELETE')})},Promise.resolve())
          .then(function(){var pp=persBy(id);if(pp&&pp.src==='disp'){return (pp.all||[id]).reduce(function(pr,x){return pr.then(function(){return gdb('/disponibilita/'+encodeURIComponent(x),'DELETE')})},Promise.resolve())}return gdb('/gestione/persone/'+encodeURIComponent(id),'DELETE')}).then(function(){asig='';return loadAdmin()}).catch(function(){say('Non sono riuscito a rimuovere.')});
      });
    }});
    $('padd').onclick=function(){
      var nome=$('pn').value.trim();if(!nome){$('pn').focus();return}
      var rec={nome:nome,matricola:$('pm').value.trim(),argomento:$('pa').value.trim(),giorni:giorniSel.slice().sort().join(''),ts:Date.now()};
      $('padd').disabled=true;
      gdb('/gestione/persone','POST',rec).then(function(){giorniSel=[];['pn','pm','pa'].forEach(function(i){$(i).value=''});asig='';return loadAdmin()}).catch(function(){say('Non sono riuscito a salvare.')}).then(function(){if($('padd'))$('padd').disabled=false});
    };
    if($('pcsv'))$('pcsv').onclick=function(){csvDownload('elenco.csv',[['#','Nome','Matricola','Argomento','Giornata','Gruppo','Altro']].concat(persone.map(function(p,i){return [i+1,p.nome,p.matricola,p.argomento,giorniTxt(p.giorni),p.tipo==='g2'?'da 2':p.tipo==='g3'?'da 3':'solo',p.note||'']})))};
    if($('bcsv'))$('bcsv').onclick=function(){csvDownload('prenotazioni.csv',[['Giorno','Dalle','Alle','Durata (min)','Nome','Matricola','Argomento']].concat(list.map(function(p){return [DAYS[p.day].full,hm(p.start),hm(p.start+p.dur),p.dur,p.name,p.matr||'',p.topic]})))};
    if(provaOpen){
      $('pgrid').appendChild(buildSplit({rh:pRH(),small:true,pv:true,from:Math.min(8*60,pRange()[0]),to:pRange()[1],
        items:function(d){return prova.filter(function(e){return e.day===d}).map(function(e){var p=pOf(e);return {id:e.id,start:e.start,dur:e.dur,cls:'pv'+(e.pub?' done':'')+(e.chk?' chk':''),html:(e.pub?'✓ ':'')+'<b>'+esc(p?p.nome:'(rimosso)')+'</b>'+(p&&p.argomento?'<span class="tm">'+esc(p.argomento)+'</span>':'')}})},
        cell:function(d,m){pst={mode:'place',d:d,m:m,dur:10};if(m+10>TO)return;psheet()},
        evclick:function(x){var e=prova.filter(function(q){return q.id===x.id})[0];if(!e)return;pst={mode:'edit',id:e.id,day:e.day,start:e.start,dur:e.dur};psheet()}}));
      setTimeout(fitGrid,0);
      a.querySelectorAll('[data-okchk]').forEach(function(b){b.onclick=function(){var e=prova.filter(function(x){return x.id===b.getAttribute('data-okchk')})[0];if(!e)return;b.disabled=true;
        gdb('/gestione/prova/'+encodeURIComponent(e.id),'PUT',{pr:e.pr,prn:e.prn||undefined,nm:e.nm||undefined,imp:e.imp||undefined,pid:e.pid,day:e.day,start:e.start,dur:e.dur,ts:Date.now(),pub:e.pub||undefined,vis:e.vis||undefined})
        .then(function(){e.chk='';asig='';return loadAdmin()}).then(function(){renderEl()}).catch(function(){b.disabled=false;say('Non sono riuscito a salvare.')})}});
      a.querySelectorAll('[data-pr]').forEach(function(b){b.onclick=function(){curPr=b.getAttribute('data-pr');setPr();renderEl()}});
      $('prnew').onclick=function(){var l=prList(),n=String(Math.max.apply(null,l.map(Number))+1);extraPr.push(n);curPr=n;setPr();renderEl()};
      if($('prdel'))$('prdel').onclick=function(){
        ask('Eliminare «'+prName(curPr)+'»? Le persone già caricate nel calendario normale restano lì.','Elimina').then(function(ok){if(!ok)return;
        var gone=curPr;
        prova.reduce(function(pr,e){return pr.then(function(){return gdb('/gestione/prova/'+encodeURIComponent(e.id),'DELETE')})},Promise.resolve())
          .then(function(){extraPr=extraPr.filter(function(x){return x!==gone});provaAll=provaAll.filter(function(e){return e.pr!==gone});curPr=prList().filter(function(x){return x!==gone})[0]||'1';setPr();asig='';return loadAdmin()})
          .then(function(){renderEl()}).catch(function(){say('Non sono riuscito a eliminare.')});
        });
      };
      $('ppub').onclick=publishProva;
      a.querySelectorAll('[data-ins]').forEach(function(b){b.onclick=function(){
        var p=persBy(b.getAttribute('data-ins')),du=defDur(p),d=bestDay(p,du);
        if(d<0){say('Non c’è posto nelle giornate di questa persona.');return}
        provaAdd(p,d,du).then(function(id){var e=prova.filter(function(q){return q.id===id})[0];pst={mode:'edit',id:id,day:e.day,start:e.start,dur:e.dur};asig='';return loadAdmin()}).then(function(){psheet()}).catch(function(){say('Non sono riuscito a inserire.')});
      }});
      if($('provacsv'))$('provacsv').onclick=function(){csvDownload(prName(curPr).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv',[['Giorno','Dalle','Alle','Nome','Matricola','Argomento']].concat(prova.slice().sort(function(x,y){return x.day*10000+x.start-(y.day*10000+y.start)}).map(function(e){var p=pOf(e)||{};return [DAYS[e.day].full,hm(e.start),hm(e.start+e.dur),p.nome||'',p.matricola||'',p.argomento||'']})))};
    }
  }

  function fitTag(){var t=$('tag');if(!t||!t.offsetParent)return;var sz=15.5;t.style.fontSize=sz+'px';while(t.scrollWidth>t.clientWidth&&sz>9){sz-=.25;t.style.fontSize=sz+'px'}}
  fitTag();window.addEventListener('resize',fitTag);window.addEventListener('load',fitTag);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTag);
  function restoreSession(){
    var rt='';try{rt=localStorage.getItem('adm_rt')||''}catch(e){}
    if(!rt)return;
    auth={t:'x',r:rt,exp:0};
    getToken().then(function(){admin=true;render();sheet();if(page==='el')renderEl();return loadAdmin()}).catch(function(){try{localStorage.removeItem('adm_rt')}catch(e){}auth={t:null,r:null,exp:0}});
  }
  if(DEMO)$('demo').hidden=false;
  renderTabs();
  render();
  load();
  restoreSession();
  setInterval(function(){if(!document.hidden&&!busy){load();loadAdmin()}},POLL);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){load();loadAdmin()}});
})();
</script>
</body>
</html>
